[project]
name = "mcp-webdav"
version = "0.1.0"
description = "WebDAV file management MCP server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["fastmcp>=2.0", "webdav4>=0.11", "loguru"]

[project.urls]
Homepage = "https://github.com/zhengxiaowai/mcps"

[project.scripts]
mcp-webdav = "webdav:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["webdav"]
